name: Request to add a DAQ asset file
description: File a request to add an asset file to the dunedaq.opensciencegrid.org area on cvmfs.
title: "[Add Asset]: "
#labels: ["bug", "triage"]
assignees:
  - andrewmogan
body:
  - type: markdown
    attributes:
      value: |
        Please fill all of the fields below so that we can fulfill your request.
  - type: input
    id: description
    attributes:
      label: Description of the asset file
      description: Provide a brief description of the asset file.
      placeholder: ex. Sample TDE Ethernet data generated from run 39324 at NP02
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location of the file
      description: Provide the absolute path to the asset file, including the node name. Make sure it's readable by others so we can copy it.
      placeholder: ex. daq.fnal.gov:/home/nfs/user/my_asset_file.bin
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Number and size of file(s)
      description: Provide the number of asset files and their sizes.
      placeholder: ex. 4 files, "wibeth-frames-X.bin". Each 232KB. X is from 0-3
    validations:
      required: true
  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      description: What subsystem does this asset correspond to?
      options:
        - trigger
        - readout
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Tell us why this file is useful.
      placeholder: Used for testing PDS TP generation in emulated-data systems.
